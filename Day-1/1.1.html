<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florium Flower Shop</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:pink;
}

.topbar{
    background:black;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    font-size:14px;
}

.topbar .logo{
    color:skyblue;
    font-size:16px;
    font-weight:bold;
}

.topbar .cart{
    font-size:14px;
}

.contact-section{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 30px;
    color:white;
    font-size:14px;
}

.brand{
    font-size:36px;
    font-weight:bold;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:25px;
    padding:12px;
    border-top:1px solid white;
    border-bottom:1px solid white;
}

.navbar a{
    text-decoration:none;
    color:white;
    font-size:14px;
    font-weight:bold;
}
.hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:40px 30px;
}

.hero-text{
    width:50%;
    color:white;
}

.hero-text h3{
    font-size:22px;
    margin:0;
}

.hero-text h1{
    font-size:50px;
    margin:15px 0;
}

.hero-text p{
    font-size:16px;
    line-height:1.5;
    max-width:400px;
}

.btn{
    display:inline-block;
    background:white;
    color:black;
    padding:10px 18px;
    text-decoration:none;
    margin-top:15px;
    font-size:14px;
    font-weight:bold;
    border-radius:5px;
}

.hero-image{
    width:35%;
    text-align:center;
}

.hero-image img{
    width:100%;
    max-width:320px;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="topbar">

    <div class="logo">
        Florium - Flower Store Website
    </div>

    <div>
        🖥
    </div>

    <div class="cart">
        Add to Cart
    </div>

</div>

<div class="contact-section">

    <div>
        <b>Call us: +1 (844) 123 456 78</b><br><br>
        info@demolink.org
    </div>

    <div class="brand">
        Florium
    </div>

    <div></div>

</div>

<div class="navbar">

    <a href="#">HOME</a>
    <a href="#">PAGES</a>
    <a href="#">BLOG</a>
    <a href="#">GALLERY</a>
    <a href="#">ELEMENTS</a>
    <a href="#">SHOP</a>

</div>

<div class="hero">

    <div class="hero-text">

        <h3>WELCOME TO #1 FLOWER SHOP</h3>

        <h1>FLORIUM</h1>

        <p>
            Established in 1999, our flower shop provides
            a wide variety of the best floral arrangements.
        </p>

        <a href="#" class="btn">SHOP NOW</a>

    </div>

    <div class="hero-image">

        <img src="https://images.unsplash.com/photo-1525310072745-f49212b5ac6d?q=80&w=1200&auto=format&fit=crop" alt="Flowers">

    </div>

</div>

</body>
</html>
